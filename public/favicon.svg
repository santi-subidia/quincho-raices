<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular Background in Deep Brand Emerald -->
  <circle cx="32" cy="32" r="30" fill="#1b382b" stroke="#34d399" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="26" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Botanical Sprout Leaves (Top) -->
  <path
    d="M32 30 C30 22, 22 16, 17 18 C16 24, 23 28, 32 30 Z"
    fill="#34d399"
  />
  <path
    d="M32 30 C34 20, 42 15, 47 17 C48 23, 41 28, 32 30 Z"
    fill="#10b981"
  />
  <path
    d="M32 30 C31 21, 32 14, 32 12 C33 14, 34 21, 32 30 Z"
    stroke="#a7f3d0"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Main Trunk / Stalk -->
  <path
    d="M32 28 L32 40"
    stroke="#a7f3d0"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Deep Roots Spreading Out (Bottom) -->
  <path
    d="M32 38 C30 44, 24 48, 18 50 M32 40 C31 46, 27 52, 25 54 M32 38 C34 44, 40 48, 46 50 M32 40 C33 46, 37 52, 39 54"
    stroke="#34d399"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Golden Dewdrop Sparkle -->
  <circle cx="32" cy="28" r="2" fill="#fbbf24" />
</svg>
